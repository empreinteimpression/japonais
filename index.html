<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Hiragana & Katakana Cyberpunk</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(10, 10, 26, 0.7), rgba(10, 10, 26, 0.7)), 
                        url('https://images.unsplash.com/photo-1542051841857-5f90071e7989?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-x: hidden;
        }

        .container {
            background: rgba(20, 20, 35, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 20px rgba(102, 126, 234, 0.3);
            padding: 30px;
            max-width: 600px;
            width: 100%;
            color: #fff;
            position: relative;
            z-index: 2;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(102, 126, 234, 0.8);
            margin-bottom: 25px;
            font-size: 26px;
        }

        /* --- VUES --- */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* --- OPTIONS / ACCUEIL --- */
        .section-title {
            font-size: 13px;
            color: #a0b0ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-align: center;
            margin-top: 15px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 10px 16px;
            border: 2px solid #667eea;
            background: rgba(255, 255, 255, 0.05);
            color: #a0b0ff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 100px;
            text-align: center;
        }

        .btn:hover, .btn.active {
            background: #667eea;
            color: white;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.6);
        }

        .checkboxes {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 13px;
            color: #ddd;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #ff007f;
        }

        .btn-start {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff007f 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.8);
        }

        /* --- HEADER DU QUIZ --- */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #a0b0ff;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-icon:hover {
            background: rgba(255, 0, 127, 0.3);
            border-color: #ff007f;
            color: #fff;
        }

        /* BARRE DE PROGRESSION NÉON LIQUIDE & GLOW */
        .progress-bar-container {
            flex: 1;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff007f, #00f0ff, #764ba2);
            border-radius: 10px;
            animation: neonGlow 2s infinite alternate;
            transition: width 0.3s ease;
        }

        @keyframes neonGlow {
            0% { box-shadow: 0 0 5px #ff007f, 0 0 10px #ff007f; }
            50% { box-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff; }
            100% { box-shadow: 0 0 5px #764ba2, 0 0 10px #764ba2; }
        }

        .stats {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 12px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #00f0ff;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
        }

        .quiz-area {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
        }

        /* ANIMATIONS VISUELLES VALIDATION (RALENTIES À 0.8s) */
        .quiz-area.correct-flash {
            animation: popCorrect 0.8s ease forwards;
        }

        .quiz-area.incorrect-flash {
            animation: shakeIncorrect 0.8s ease forwards;
        }

        @keyframes popCorrect {
            0% { transform: scale(1); box-shadow: 0 0 0px rgba(0, 240, 255, 0); }
            40% { transform: scale(1.04); box-shadow: 0 0 40px rgba(0, 240, 255, 0.9), inset 0 0 20px rgba(0, 240, 255, 0.5); border-color: #00f0ff; }
            100% { transform: scale(1); box-shadow: 0 0 0px rgba(0, 240, 255, 0); }
        }

        @keyframes shakeIncorrect {
            0%, 100% { transform: translateX(0); box-shadow: 0 0 0px rgba(255, 0, 127, 0); }
            15% { transform: translateX(-14px); box-shadow: 0 0 35px rgba(255, 0, 127, 0.9); border-color: #ff007f; }
            30% { transform: translateX(14px); box-shadow: 0 0 35px rgba(255, 0, 127, 0.9); border-color: #ff007f; }
            45% { transform: translateX(-10px); box-shadow: 0 0 25px rgba(255, 0, 127, 0.7); }
            60% { transform: translateX(10px); box-shadow: 0 0 25px rgba(255, 0, 127, 0.7); }
            75% { transform: translateX(-5px); }
        }

        .kana-character {
            font-size: 75px;
            margin: 10px 0;
            font-weight: bold;
            color: #ff007f;
            text-shadow: 0 0 20px rgba(255, 0, 127, 0.8);
            font-family: 'MS Mincho', 'Hiragino Mincho Pro', serif;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .kana-type {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .input-group input {
            flex: 1;
            padding: 14px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        /* CLAVIER VIRTUEL KANA CONSERVÉ ET OPTIMISÉ */
        .virtual-keyboard-wrapper {
            margin-top: 15px;
            display: none;
            flex-direction: column;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
        }

        .virtual-keyboard-wrapper.active {
            display: flex;
        }

        .keyboard-top-bar {
            display: flex;
            justify-content: flex-end;
        }

        .virtual-keyboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
            gap: 6px;
            max-height: 180px;
            overflow-y: auto;
        }

        .key-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 0;
            border-radius: 6px;
            font-size: 18px;
            font-family: 'MS Mincho', 'Hiragino Mincho Pro', serif;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .key-btn:hover {
            background: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.8);
            border-color: #667eea;
        }

        .key-btn.backspace {
            width: 100%;
            background: rgba(255, 0, 127, 0.2);
            border-color: rgba(255, 0, 127, 0.4);
            color: #ff007f;
            font-size: 14px;
            font-family: inherit;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .key-btn.backspace:hover {
            background: #ff007f;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.8);
        }

        .btn-submit {
            background: #667eea;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:hover {
            background: #764ba2;
        }

        .feedback-banner {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            display: none;
        }

        .feedback-banner.correct {
            display: block;
            background: rgba(46, 125, 50, 0.3);
            border: 1px solid #4caf50;
            color: #81c784;
        }

        .feedback-banner.incorrect {
            display: block;
            background: rgba(198, 40, 40, 0.3);
            border: 1px solid #f44336;
            color: #e57373;
        }

        .streak {
            display: inline-block;
            background: #ff007f;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.6);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
        }

        /* --- ÉCRAN DE RÉSULTATS --- */
        .results-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .accuracy-badge {
            font-size: 48px;
            font-weight: bold;
            color: #00f0ff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
            margin: 10px 0;
        }

        .speed-badge {
            font-size: 14px;
            color: #a0b0ff;
            margin-bottom: 10px;
        }

        .errors-container {
            max-height: 180px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
        }

        .errors-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }

        .error-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 0, 127, 0.4);
            padding: 8px;
            border-radius: 8px;
            text-align: center;
        }

        .error-char {
            font-size: 22px;
            color: #ff007f;
            font-weight: bold;
        }

        .error-ans {
            font-size: 12px;
            color: #aaa;
            margin-top: 2px;
        }

        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-action {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 14px;
        }

        .btn-retry-errors {
            background: linear-gradient(135deg, #ff007f 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        .btn-retry {
            background: #667eea;
            color: white;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.4);
        }

        .btn-options {
            background: rgba(255, 255, 255, 0.1);
            color: #a0b0ff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-action:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }

        /* POPUP DE CONFIRMATION */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 26, 0.9);
            border-radius: 20px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: rgba(30, 30, 50, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        /* PARTICULES DE VICTOIRE */
        .confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 99;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 20px 15px; border-radius: 16px; }
            h1 { font-size: 22px; }
            .kana-character { font-size: 60px; }
            .input-group { flex-direction: column; }
            .btn-submit { width: 100%; }
            .stats { padding: 8px; }
            .stat-value { font-size: 18px; }
            .controls { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

    <div class="container">
        <h1>🎌 Quiz Hiragana & Katakana</h1>

        <div id="setupScreen" class="screen active">
            <div class="section-title">Mode de jeu</div>
            <div class="controls">
                <button class="btn active" id="directionKanaToRomaji" onclick="setDirection('kanaToRomaji', event)">Kana ➔ Romaji</button>
                <button class="btn" id="directionRomajiToKana" onclick="setDirection('romajiToKana', event)">Romaji ➔ Kana</button>
            </div>

            <div class="section-title">Caractères</div>
            <div class="controls">
                <button class="btn active" onclick="selectMode('all', event)">Les deux</button>
                <button class="btn" onclick="selectMode('hiragana', event)">Hiragana</button>
                <button class="btn" onclick="selectMode('katakana', event)">Katakana</button>
            </div>

            <div class="section-title">Variantes & Clavier</div>
            <div class="checkboxes">
                <label class="checkbox-label">
                    <input type="checkbox" id="dakutenCheck" checked>
                    <span>Dakuten (濁点) - が、ぎ、ぐ...</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="handakutenCheck" checked>
                    <span>Handakuten (半濁点) - ぱ、ぴ、ぷ...</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="youonCheck">
                    <span>Combinaisons (拗音) - きゃ、きゅ、きょ...</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="randomKbCheck" checked>
                    <span>🔀 Clavier virtuel mélangé (Touches dans le désordre)</span>
                </label>
            </div>

            <button class="btn-start" onclick="startQuiz()">🚀 Commencer le Quiz</button>
        </div>

        <div id="quizScreen" class="screen">
            <div class="quiz-header">
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <button class="btn-icon" id="soundToggleBtn" onclick="toggleSound()" title="Activer/Désactiver le son">🔊 Son</button>
                <button class="btn-icon" onclick="confirmQuit()" title="Accueil (Echap)">🏠 Accueil</button>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">Progression</div>
                    <div class="stat-value" id="progressText">0/0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Correct</div>
                    <div class="stat-value" id="correctCount" style="color: #4caf50;">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Incorrect</div>
                    <div class="stat-value" id="incorrectCount" style="color: #f44336;">0</div>
                </div>
            </div>

            <div class="quiz-area" id="quizArea">
                <div class="kana-type" id="typeLabel">Hiragana</div>
                <div class="kana-character" id="kanaChar">あ</div>
                
                <div class="input-group">
                    <input type="text" id="answerInput" placeholder="Saisir la réponse..." autocomplete="off" autocapitalize="none">
                    <button class="btn-submit" onclick="checkAnswer()">Vérifier</button>
                </div>

                <div class="virtual-keyboard-wrapper" id="virtualKeyboardWrapper">
                    <div class="keyboard-top-bar">
                        <button type="button" class="key-btn backspace" onclick="handleBackspace()">⌫ Effacer</button>
                    </div>
                    <div class="virtual-keyboard" id="virtualKeyboard"></div>
                </div>

                <div class="feedback-banner" id="feedbackBanner"></div>
                <div class="streak" id="streakDisplay" style="display: none;"></div>
            </div>
        </div>

        <div id="resultsScreen" class="screen">
            <div class="results-header">
                <div class="section-title" style="margin-top:0;">Session terminée</div>
                <div class="accuracy-badge" id="finalAccuracy">0%</div>
                <div class="speed-badge" id="finalSpeedText">⚡ Temps moyen : 0s par réponse</div>
                <p id="finalScoreText" style="color: #aaa; font-size: 14px;">0 réponses correctes sur 0</p>
            </div>

            <div id="errorsSection">
                <div class="section-title" style="text-align: left; color: #ff007f; margin-top:0;">Caractères à réviser :</div>
                <div class="errors-container">
                    <div class="errors-list" id="errorsList"></div>
                </div>
            </div>

            <div class="actions-group">
                <button class="btn-action btn-retry-errors" id="btnRetryErrors" onclick="retryErrorsOnly()" style="display:none;">🎯 Rejouer uniquement les erreurs</button>
                <button class="btn-action btn-retry" onclick="startQuiz()">🔄 Recommencer tout le quiz</button>
                <button class="btn-action btn-options" onclick="showScreen('setupScreen')">⚙️ Modifier les options</button>
            </div>
        </div>

        <div class="modal-overlay" id="confirmModal">
            <div class="modal-content">
                <p style="font-weight: bold; font-size: 16px;">Quitter le quiz ?</p>
                <p style="color: #aaa; font-size: 13px; margin-top: 8px;">Votre progression actuelle sera perdue.</p>
                <div class="modal-btns">
                    <button class="modal-btn" style="background: rgba(255,255,255,0.1); color: #fff;" onclick="closeModal()">Annuler</button>
                    <button class="modal-btn" style="background: #ff007f; color: #fff;" onclick="quitToHome()">Quitter</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const hiraganaBase = {
            'あ': 'a', 'い': 'i', 'う': 'u', 'え': 'e', 'お': 'o',
            'か': 'ka', 'き': 'ki', 'く': 'ku', 'け': 'ke', 'こ': 'ko',
            'が': 'ga', 'ぎ': 'gi', 'ぐ': 'gu', 'げ': 'ge', 'ご': 'go',
            'さ': 'sa', 'し': 'shi', 'す': 'su', 'せ': 'se', 'そ': 'so',
            'ざ': 'za', 'じ': 'ji', 'ず': 'zu', 'ぜ': 'ze', 'ぞ': 'zo',
            'た': 'ta', 'ち': 'chi', 'つ': 'tsu', 'て': 'te', 'と': 'to',
            'だ': 'da', 'ぢ': 'di', 'づ': 'du', 'で': 'de', 'ど': 'do',
            'な': 'na', 'に': 'ni', 'ぬ': 'nu', 'ね': 'ne', 'の': 'no',
            'は': 'ha', 'ひ': 'hi', 'ふ': 'fu', 'へ': 'he', 'ほ': 'ho',
            'ば': 'ba', 'び': 'bi', 'ぶ': 'bu', 'べ': 'be', 'ぼ': 'bo',
            'ぱ': 'pa', 'ぴ': 'pi', 'ぷ': 'pu', 'ぺ': 'pe', 'ぽ': 'po',
            'ま': 'ma', 'み': 'mi', 'む': 'mu', 'め': 'me', 'も': 'mo',
            'や': 'ya', 'ゆ': 'yu', 'よ': 'yo',
            'ら': 'ra', 'り': 'ri', 'る': 'ru', 'れ': 're', 'ろ': 'ro',
            'わ': 'wa', 'ゐ': 'wi', 'ゑ': 'we', 'を': 'wo', 'ん': 'n'
        };

        const hiraganaYouon = {
            'きゃ': 'kya', 'きゅ': 'kyu', 'きょ': 'kyo',
            'しゃ': 'sha', 'しゅ': 'shu', 'しょ': 'sho',
            'ちゃ': 'cha', 'ちゅ': 'chu', 'ちょ': 'cho',
            'にゃ': 'nya', 'にゅ': 'nyu', 'にょ': 'nyo',
            'ひゃ': 'hya', 'ひゅ': 'hyu', 'ひょ': 'hyo',
            'みゃ': 'mya', 'みゅ': 'myu', 'みょ': 'myo',
            'りゃ': 'rya', 'りゅ': 'ryu', 'りょ': 'ryo',
            'ぎゃ': 'gya', 'ぎゅ': 'gyu', 'ぎょ': 'gyo',
            'じゃ': 'ja', 'じゅ': 'ju', 'じょ': 'jo',
            'びゃ': 'bya', 'びゅ': 'byu', 'びょ': 'byo',
            'ぴゃ': 'pya', 'ぴゅ': 'pyu', 'ぴょ': 'pyo'
        };

        const katakanaBase = {
            'ア': 'a', 'イ': 'i', 'ウ': 'u', 'エ': 'e', 'オ': 'o',
            'カ': 'ka', 'キ': 'ki', 'ク': 'ku', 'ケ': 'ke', 'コ': 'ko',
            'ガ': 'ga', 'ギ': 'gi', 'グ': 'gu', 'ゲ': 'ge', 'ゴ': 'go',
            'サ': 'sa', 'シ': 'shi', 'ス': 'su', 'セ': 'se', 'ソ': 'so',
            'ザ': 'za', 'ジ': 'ji', 'ズ': 'zu', 'ゼ': 'ze', 'ゾ': 'zo',
            'タ': 'ta', 'チ': 'chi', 'ツ': 'tsu', 'テ': 'te', 'ト': 'to',
            'ダ': 'da', 'ヂ': 'di', 'ヅ': 'du', 'デ': 'de', 'ド': 'do',
            'ナ': 'na', 'ニ': 'ni', 'ヌ': 'nu', 'ネ': 'ne', 'ノ': 'no',
            'ハ': 'ha', 'ヒ': 'hi', 'フ': 'fu', 'ヘ': 'he', 'ホ': 'ho',
            'バ': 'ba', 'ビ': 'bi', 'ブ': 'bu', 'ベ': 'be', 'ボ': 'bo',
            'パ': 'pa', 'ピ': 'pi', 'プ': 'pu', 'ペ': 'pe', 'ポ': 'po',
            'マ': 'ma', 'ミ': 'mi', 'ム': 'mu', 'メ': 'me', 'モ': 'mo',
            'ヤ': 'ya', 'ユ': 'yu', 'ヨ': 'yo',
            'ラ': 'ra', 'リ': 'ri', 'ル': 'ru', 'レ': 're', 'ロ': 'ro',
            'ワ': 'wa', 'ヰ': 'wi', 'ヱ': 'we', 'ヲ': 'wo', 'ン': 'n'
        };

        const katakanaYouon = {
            'キャ': 'kya', 'キュ': 'kyu', 'キョ': 'kyo',
            'シャ': 'sha', 'シュ': 'shu', 'ショ': 'sho',
            'チャ': 'cha', 'チュ': 'chu', 'チョ': 'cho',
            'ニャ': 'nya', 'ニュ': 'nyu', 'ニョ': 'nyo',
            'ヒャ': 'hya', 'ヒュ': 'hyu', 'ヒョ': 'hyo',
            'ミャ': 'mya', 'ミュ': 'myu', 'ミョ': 'myo',
            'リャ': 'rya', 'リュ': 'ryu', 'リョ': 'ryo',
            'ギャ': 'gya', 'ギュ': 'gyu', 'ギョ': 'gyo',
            'ジャ': 'ja', 'ジュ': 'ju', 'ジョ': 'jo',
            'ビャ': 'bya', 'ビュ': 'byu', 'ビョ': 'byo',
            'ピャ': 'pya', 'ピュ': 'pyu', 'ピョ': 'pyo'
        };

        const romajiSynonyms = {
            'shi': ['si'], 'si': ['shi'],
            'chi': ['ti'], 'ti': ['chi'],
            'tsu': ['tu'], 'tu': ['tsu'],
            'fu': ['hu'], 'hu': ['fu'],
            'ji': ['zi'], 'zi': ['ji'],
            'sha': ['sya'], 'shu': ['syu'], 'sho': ['syo'],
            'cha': ['tya'], 'chu': ['tyu'], 'cho': ['tyo'],
            'ja': ['zya', 'jya'], 'ju': ['zyu', 'jyu'], 'jo': ['zyo', 'jyo']
        };

        let selectedMode = 'all';
        let quizDirection = 'kanaToRomaji';
        let quizList = [];
        let currentIndex = 0;
        let stats = { correct: 0, incorrect: 0, streak: 0 };
        let failedKana = [];
        
        // NOUVELLES VARIABLES
        let soundEnabled = true;
        let quizStartTime = 0;
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        function playSFX(type) {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); // A5
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                } else if (type === 'incorrect') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(110, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.2);
                }
            } catch (e) { console.log(e); }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggleBtn').textContent = soundEnabled ? '🔊 Son' : '🔇 Muet';
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function setDirection(dir, event) {
            quizDirection = dir;
            document.querySelectorAll('#directionKanaToRomaji, #directionRomajiToKana').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function selectMode(mode, event) {
            selectedMode = mode;
            event.target.parentElement.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function filterKana(kanaEntries) {
            const dakutenChecked = document.getElementById('dakutenCheck').checked;
            const handakutenChecked = document.getElementById('handakutenCheck').checked;

            const dakutenChars = ['が', 'ぎ', 'ぐ', 'げ', 'ご', 'ざ', 'じ', 'ず', 'ぜ', 'ぞ', 'だ', 'ぢ', 'づ', 'で', 'ど', 'ば', 'び', 'ぶ', 'べ', 'ぼ', 'ぎゃ', 'ぎゅ', 'ぎょ', 'じゃ', 'じゅ', 'じょ', 'びゃ', 'びゅ', 'びょ', 'ガ', 'ギ', 'グ', 'ゲ', 'ゴ', 'ザ', 'ジ', 'ズ', 'ゼ', 'ゾ', 'ダ', 'ヂ', 'ヅ', 'デ', 'ド', 'バ', 'ビ', 'ブ', 'ベ', 'ボ', 'ギャ', 'ギュ', 'ギョ', 'ジャ', 'ジュ', 'ジョ', 'ビャ', 'ビュ', 'ビョ'];
            const handakutenChars = ['ぱ', 'ぴ', 'ぷ', 'ぺ', 'ぽ', 'ぴゃ', 'ぴゅ', 'ぴょ', 'パ', 'ピ', 'プ', 'ペ', 'ポ', 'ピャ', 'ピュ', 'ピョ'];

            return kanaEntries.filter(([kana]) => {
                if (dakutenChars.includes(kana) && !dakutenChecked) return false;
                if (handakutenChars.includes(kana) && !handakutenChecked) return false;
                return true;
            });
        }

        function buildPool() {
            const youonChecked = document.getElementById('youonCheck').checked;
            let entries = [];

            if (selectedMode === 'all' || selectedMode === 'hiragana') {
                entries = entries.concat(filterKana(Object.entries(hiraganaBase)));
                if (youonChecked) entries = entries.concat(filterKana(Object.entries(hiraganaYouon)));
            }
            if (selectedMode === 'all' || selectedMode === 'katakana') {
                entries = entries.concat(filterKana(Object.entries(katakanaBase)));
                if (youonChecked) entries = entries.concat(filterKana(Object.entries(katakanaYouon)));
            }

            return entries;
        }

        function startQuiz() {
            let entries = buildPool();

            if (entries.length === 0) {
                alert('Veuillez sélectionner au moins une option !');
                return;
            }

            quizList = entries.sort(() => Math.random() - 0.5);
            currentIndex = 0;
            stats = { correct: 0, incorrect: 0, streak: 0 };
            failedKana = [];
            quizStartTime = Date.now();

            showScreen('quizScreen');
            updateStatsUI();
            displayQuestion();
        }

        function retryErrorsOnly() {
            if (failedKana.length === 0) return;
            quizList = failedKana.map(item => [item.kana, item.answer]).sort(() => Math.random() - 0.5);
            currentIndex = 0;
            stats = { correct: 0, incorrect: 0, streak: 0 };
            failedKana = [];
            quizStartTime = Date.now();

            showScreen('quizScreen');
            updateStatsUI();
            displayQuestion();
        }

        function renderVirtualKeyboard(isHiragana) {
            const wrapper = document.getElementById('virtualKeyboardWrapper');
            const kbContainer = document.getElementById('virtualKeyboard');

            if (quizDirection !== 'romajiToKana') {
                wrapper.classList.remove('active');
                return;
            }

            kbContainer.innerHTML = '';
            wrapper.classList.add('active');

            const sourceBase = isHiragana ? hiraganaBase : katakanaBase;
            const sourceYouon = isHiragana ? hiraganaYouon : katakanaYouon;
            const filteredBase = filterKana(Object.entries(sourceBase));
            const filteredYouon = document.getElementById('youonCheck').checked ? filterKana(Object.entries(sourceYouon)) : [];

            let keys = [...filteredBase, ...filteredYouon];

            // Option : Clavier virtuel aléatoire (touches dans le désordre)
            if (document.getElementById('randomKbCheck').checked) {
                keys = keys.sort(() => Math.random() - 0.5);
            }

            keys.forEach(([kana]) => {
                const btn = document.createElement('button');
                btn.className = 'key-btn';
                btn.textContent = kana;
                btn.type = 'button';
                btn.onclick = () => {
                    const input = document.getElementById('answerInput');
                    input.value += kana;
                    input.focus();
                };
                kbContainer.appendChild(btn);
            });
        }

        function handleBackspace() {
            const input = document.getElementById('answerInput');
            input.value = input.value.slice(0, -1);
            input.focus();
        }

        function displayQuestion() {
            if (currentIndex >= quizList.length) {
                endQuiz();
                return;
            }

            const [kana, romaji] = quizList[currentIndex];
            const isHiragana = (hiraganaBase[kana] !== undefined || hiraganaYouon[kana] !== undefined);

            const charElem = document.getElementById('kanaChar');
            const typeLabel = document.getElementById('typeLabel');

            if (quizDirection === 'kanaToRomaji') {
                charElem.textContent = kana;
                typeLabel.textContent = isHiragana ? 'Hiragana ➔ Romaji' : 'Katakana ➔ Romaji';
            } else {
                charElem.textContent = romaji;
                typeLabel.textContent = isHiragana ? 'Romaji ➔ Hiragana' : 'Romaji ➔ Katakana';
            }

            renderVirtualKeyboard(isHiragana);

            const input = document.getElementById('answerInput');
            input.value = '';
            input.focus();

            document.getElementById('feedbackBanner').style.display = 'none';

            const pct = (currentIndex / quizList.length) * 100;
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('progressText').textContent = `${currentIndex}/${quizList.length}`;
        }

        function checkAnswer() {
            const input = document.getElementById('answerInput');
            const userAnswer = input.value.trim().toLowerCase();
            if (!userAnswer) return;

            const [kana, romaji] = quizList[currentIndex];
            let isCorrect = false;
            let expectedDisplay = '';

            if (quizDirection === 'kanaToRomaji') {
                expectedDisplay = romaji;
                const accepted = [romaji, ...(romajiSynonyms[romaji] || [])];
                isCorrect = accepted.includes(userAnswer);
            } else {
                expectedDisplay = kana;
                isCorrect = (userAnswer === kana.toLowerCase());
            }

            const feedback = document.getElementById('feedbackBanner');
            const quizArea = document.getElementById('quizArea');

            quizArea.classList.remove('correct-flash', 'incorrect-flash');
            void quizArea.offsetWidth;

            if (isCorrect) {
                stats.correct++;
                stats.streak++;
                quizArea.classList.add('correct-flash');
                feedback.className = 'feedback-banner correct';
                feedback.textContent = '✓ Correct !';
                playSFX('correct');
            } else {
                stats.incorrect++;
                stats.streak = 0;
                quizArea.classList.add('incorrect-flash');
                failedKana.push({ kana, answer: expectedDisplay });
                feedback.className = 'feedback-banner incorrect';
                feedback.textContent = `✗ Faux ! La réponse était : ${expectedDisplay}`;
                playSFX('incorrect');
            }

            updateStatsUI();
            currentIndex++;
            displayQuestion();
        }

        function updateStatsUI() {
            document.getElementById('correctCount').textContent = stats.correct;
            document.getElementById('incorrectCount').textContent = stats.incorrect;

            const streakDisplay = document.getElementById('streakDisplay');
            if (stats.streak > 2) {
                streakDisplay.textContent = `🔥 Série : ${stats.streak}`;
                streakDisplay.style.display = 'inline-block';
            } else {
                streakDisplay.style.display = 'none';
            }
        }

        function triggerConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#ff007f', '#00f0ff', '#764ba2', '#ffffff'];

            for (let i = 0; i < 70; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vy: Math.random() * 3 + 2,
                    vx: Math.random() * 2 - 1
                });
            }

            let animationFrame;
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.y += p.vy;
                    p.x += p.vx;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                if (particles.some(p => p.y < canvas.height)) {
                    animationFrame = requestAnimationFrame(render);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            render();
        }

        function endQuiz() {
            showScreen('resultsScreen');

            const total = quizList.length;
            const accuracy = total === 0 ? 0 : Math.round((stats.correct / total) * 100);

            // Calcul du temps moyen par réponse
            const totalTime = (Date.now() - quizStartTime) / 1000;
            const avgSpeed = total > 0 ? (totalTime / total).toFixed(1) : 0;

            document.getElementById('finalAccuracy').textContent = accuracy + '%';
            document.getElementById('finalSpeedText').textContent = `⚡ Temps moyen : ${avgSpeed}s par réponse`;
            document.getElementById('finalScoreText').textContent = `${stats.correct} bonnes réponses sur ${total}`;

            if (accuracy >= 80) {
                triggerConfetti();
            }

            const errorsSection = document.getElementById('errorsSection');
            const errorsList = document.getElementById('errorsList');
            const btnRetryErrors = document.getElementById('btnRetryErrors');
            errorsList.innerHTML = '';

            if (failedKana.length > 0) {
                errorsSection.style.display = 'block';
                btnRetryErrors.style.display = 'block';
                failedKana.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'error-card';
                    card.innerHTML = `
                        <div class="error-char">${item.kana}</div>
                        <div class="error-ans">${item.answer}</div>
                    `;
                    errorsList.appendChild(card);
                });
            } else {
                errorsSection.style.display = 'none';
                btnRetryErrors.style.display = 'none';
            }
        }

        /* CONFIRMATION ACCUEIL */
        function confirmQuit() {
            document.getElementById('confirmModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('confirmModal').classList.remove('active');
        }

        function quitToHome() {
            closeModal();
            showScreen('setupScreen');
        }

        /* ÉVÉNEMENTS CLAVIER */
        document.getElementById('answerInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const quizActive = document.getElementById('quizScreen').classList.contains('active');
                if (quizActive) {
                    confirmQuit();
                }
            }
        });
    </script>
</body>
