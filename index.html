<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Hiragana & Katakana</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(10, 10, 26, 0.65), rgba(10, 10, 26, 0.65)), 
                        url('https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(20, 20, 35, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 20px rgba(102, 126, 234, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            color: #fff;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(102, 126, 234, 0.8);
            margin-bottom: 30px;
            font-size: 28px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: rgba(255, 255, 255, 0.05);
            color: #a0b0ff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #667eea;
            color: white;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.6);
            transform: translateY(-2px);
        }

        .btn.active {
            background: #667eea;
            color: white;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.6);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #00f0ff;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
        }

        .quiz-area {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 30px;
            text-align: center;
        }

        .kana-character {
            font-size: 80px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #ff007f;
            text-shadow: 0 0 20px rgba(255, 0, 127, 0.8);
            font-family: 'MS Mincho', 'Hiragino Mincho Pro', serif;
        }

        .kana-type {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .btn-submit {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:hover {
            background: #764ba2;
            box-shadow: 0 0 15px rgba(118, 75, 162, 0.6);
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .feedback {
            font-size: 14px;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            min-height: 20px;
        }

        .streak {
            display: inline-block;
            background: #ff007f;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.6);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
        }

        .checkboxes {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #ddd;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #ff007f;
        }

        .checkbox-label span {
            flex: 1;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .kana-character {
                font-size: 60px;
            }

            .input-group {
                flex-direction: column;
            }

            .stats {
                gap: 10px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎌 Quiz Hiragana & Katakana</h1>

        <div class="controls">
            <button class="btn active" onclick="selectMode('all', event)">Les deux</button>
            <button class="btn" onclick="selectMode('hiragana', event)">Hiragana seulement</button>
            <button class="btn" onclick="selectMode('katakana', event)">Katakana seulement</button>
        </div>

        <div class="checkboxes">
            <label class="checkbox-label">
                <input type="checkbox" id="dakutenCheck" checked onchange="reloadPool()">
                <span>Dakuten (濁点) - が、ぎ、ぐ、げ、ご...</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="handakutenCheck" checked onchange="reloadPool()">
                <span>Handakuten (半濁点) - ぱ、ぴ、ぷ、ぺ、ぽ...</span>
            </label>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">Correct</div>
                <div class="stat-value" id="correctCount">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Incorrect</div>
                <div class="stat-value" id="incorrectCount">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Précision</div>
                <div class="stat-value" id="accuracy">0%</div>
            </div>
        </div>

        <div class="quiz-area">
            <div class="kana-type" id="typeLabel">Hiragana</div>
            <div class="kana-character" id="kanaChar">あ</div>
            
            <div class="input-group">
                <input type="text" id="answerInput" placeholder="Écrivez la romanisation..." autocomplete="off">
                <button class="btn-submit" onclick="checkAnswer()">Vérifier</button>
            </div>

            <div class="feedback" id="feedback"></div>
            <div class="answer-display" id="answerDisplay"></div>
            <div class="streak" id="streakDisplay" style="display: none;"></div>
        </div>
    </div>

    <script>
        const hiragana = {
            'あ': 'a', 'い': 'i', 'う': 'u', 'え': 'e', 'お': 'o',
            'か': 'ka', 'き': 'ki', 'く': 'ku', 'け': 'ke', 'こ': 'ko',
            'が': 'ga', 'ぎ': 'gi', 'ぐ': 'gu', 'げ': 'ge', 'ご': 'go',
            'さ': 'sa', 'し': 'shi', 'す': 'su', 'せ': 'se', 'そ': 'so',
            'ざ': 'za', 'じ': 'ji', 'ず': 'zu', 'ぜ': 'ze', 'ぞ': 'zo',
            'た': 'ta', 'ち': 'chi', 'つ': 'tsu', 'て': 'te', 'と': 'to',
            'だ': 'da', 'ぢ': 'di', 'づ': 'du', 'で': 'de', 'ど': 'do',
            'な': 'na', 'に': 'ni', 'ぬ': 'nu', 'ね': 'ne', 'の': 'no',
            'は': 'ha', 'ひ': 'hi', 'ふ': 'fu', 'へ': 'he', 'ほ': 'ho',
            'ば': 'ba', 'び': 'bi', 'ぶ': 'bu', 'べ': 'be', 'ぼ': 'bo',
            'ぱ': 'pa', 'ぴ': 'pi', 'ぷ': 'pu', 'ぺ': 'pe', 'ぽ': 'po',
            'ま': 'ma', 'み': 'mi', 'む': 'mu', 'め': 'me', 'も': 'mo',
            'や': 'ya', 'ゆ': 'yu', 'よ': 'yo',
            'ら': 'ra', 'り': 'ri', 'る': 'ru', 'れ': 're', 'ろ': 'ro',
            'わ': 'wa', 'ゐ': 'wi', 'ゑ': 'we', 'を': 'wo', 'ん': 'n'
        };

        const katakana = {
            'ア': 'a', 'イ': 'i', 'ウ': 'u', 'エ': 'e', 'オ': 'o',
            'カ': 'ka', 'キ': 'ki', 'ク': 'ku', 'ケ': 'ke', 'コ': 'ko',
            'ガ': 'ga', 'ギ': 'gi', 'グ': 'gu', 'ゲ': 'ge', 'ゴ': 'go',
            'サ': 'sa', 'シ': 'shi', 'ス': 'su', 'セ': 'se', 'ソ': 'so',
            'ザ': 'za', 'ジ': 'ji', 'ズ': 'zu', 'ゼ': 'ze', 'ゾ': 'zo',
            'タ': 'ta', 'チ': 'chi', 'ツ': 'tsu', 'テ': 'te', 'ト': 'to',
            'ダ': 'da', 'ヂ': 'di', 'ヅ': 'du', 'デ': 'de', 'ド': 'do',
            'ナ': 'na', 'ニ': 'ni', 'ヌ': 'nu', 'ネ': 'ne', 'ノ': 'no',
            'ハ': 'ha', 'ヒ': 'hi', 'フ': 'fu', 'ヘ': 'he', 'ホ': 'ho',
            'バ': 'ba', 'ビ': 'bi', 'ブ': 'bu', 'ベ': 'be', 'ボ': 'bo',
            'パ': 'pa', 'ピ': 'pi', 'プ': 'pu', 'ペ': 'pe', 'ポ': 'po',
            'マ': 'ma', 'ミ': 'mi', 'ム': 'mu', 'メ': 'me', 'モ': 'mo',
            'ヤ': 'ya', 'ユ': 'yu', 'ヨ': 'yo',
            'ラ': 'ra', 'リ': 'ri', 'ル': 'ru', 'レ': 're', 'ロ': 'ro',
            'ワ': 'wa', 'ヰ': 'wi', 'ヱ': 'we', 'ヲ': 'wo', 'ン': 'n'
        };

        let mode = 'all';
        let currentKana = '';
        let currentAnswer = '';
        let currentType = '';
        let stats = {
            correct: 0,
            incorrect: 0,
            streak: 0
        };
        let kanaPool = [];
        let poolIndex = 0;

        function filterKanaByOptions(kanaList) {
            const includeDakuten = document.getElementById('dakutenCheck').checked;
            const includeHandakuten = document.getElementById('handakutenCheck').checked;

            const dakutenChars = ['が', 'ぎ', 'ぐ', 'げ', 'ご', 'ざ', 'じ', 'ず', 'ぜ', 'ぞ', 'だ', 'ぢ', 'づ', 'で', 'ど', 'ば', 'び', 'ぶ', 'べ', 'ぼ', 'ガ', 'ギ', 'グ', 'ゲ', 'ゴ', 'ザ', 'ジ', 'ズ', 'ゼ', 'ゾ', 'ダ', 'ヂ', 'ヅ', 'デ', 'ド', 'バ', 'ビ', 'ブ', 'ベ', 'ボ'];
            const handakutenChars = ['ぱ', 'ぴ', 'ぷ', 'ぺ', 'ぽ', 'パ', 'ピ', 'プ', 'ペ', 'ポ'];

            return kanaList.filter(([kana]) => {
                const isDakuten = dakutenChars.includes(kana);
                const isHandakuten = handakutenChars.includes(kana);

                if (isDakuten && !includeDakuten) return false;
                if (isHandakuten && !includeHandakuten) return false;

                return true;
            });
        }

        function createKanaPool() {
            let pool = [];
            if (mode === 'all' || mode === 'hiragana') {
                pool = pool.concat(filterKanaByOptions(Object.entries(hiragana)));
            }
            if (mode === 'all' || mode === 'katakana') {
                pool = pool.concat(filterKanaByOptions(Object.entries(katakana)));
            }

            if (pool.length === 0) {
                alert('Veuillez sélectionner au moins une option!');
                document.getElementById('dakutenCheck').checked = true;
                document.getElementById('handakutenCheck').checked = true;
                return createKanaPool();
            }

            kanaPool = pool.sort(() => Math.random() - 0.5);
            poolIndex = 0;
        }

        function reloadPool() {
            createKanaPool();
            nextQuestion();
        }

        function selectMode(newMode, event) {
            mode = newMode;
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            reloadPool();
        }

        function getNextKana() {
            if (poolIndex >= kanaPool.length) {
                createKanaPool();
            }

            const [kana, answer] = kanaPool[poolIndex];
            poolIndex++;
            const isHiragana = hiragana[kana] !== undefined;
            return { kana, answer, isHiragana };
        }

        function nextQuestion() {
            const { kana, answer, isHiragana } = getNextKana();
            currentKana = kana;
            currentAnswer = answer;
            currentType = isHiragana ? 'Hiragana' : 'Katakana';

            document.getElementById('kanaChar').textContent = kana;
            document.getElementById('typeLabel').textContent = currentType;
            document.getElementById('answerInput').value = '';
            document.getElementById('answerInput').focus();
            updateStreak();
        }

        function checkAnswer() {
            const userAnswer = document.getElementById('answerInput').value.trim().toLowerCase();

            if (!userAnswer) {
                return;
            }

            const isCorrect = userAnswer === currentAnswer;

            if (isCorrect) {
                stats.correct++;
                stats.streak++;
            } else {
                stats.incorrect++;
                stats.streak = 0;
            }

            updateStats();
            nextQuestion();
        }

        function updateStats() {
            const total = stats.correct + stats.incorrect;
            const accuracy = total === 0 ? 0 : Math.round((stats.correct / total) * 100);
            
            document.getElementById('correctCount').textContent = stats.correct;
            document.getElementById('incorrectCount').textContent = stats.incorrect;
            document.getElementById('accuracy').textContent = accuracy + '%';
        }

        function updateStreak() {
            const streakDisplay = document.getElementById('streakDisplay');
            if (stats.streak > 2) {
                streakDisplay.textContent = `🔥 Série: ${stats.streak}`;
                streakDisplay.style.display = 'inline-block';
            } else {
                streakDisplay.style.display = 'none';
            }
        }

        document.getElementById('answerInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        // Initialisation
        createKanaPool();
        nextQuestion();
    </script>
</body>
</html>
