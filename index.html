<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Japonais</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(10, 10, 26, 0.7), rgba(10, 10, 26, 0.7)), 
                        url('https://images.unsplash.com/photo-1542051841857-5f90071e7989?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .quiz-card {
            background: rgba(20, 20, 35, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            color: #fff;
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.1em;
            font-weight: 600;
        }

        .timer {
            background: rgba(255, 0, 85, 0.2);
            color: #ff0055;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #ff0055;
        }

        .score {
            background: rgba(0, 242, 254, 0.2);
            color: #00f2fe;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #00f2fe;
        }

        .question-box {
            margin: 20px 0;
        }

        .kanji-display {
            font-size: 4em;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
        }

        .input-display {
            width: 100%;
            padding: 12px;
            font-size: 1.5em;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            margin-bottom: 20px;
            outline: none;
            letter-spacing: 2px;
        }

        .virtual-keyboard {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .key-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px 5px;
            font-size: 1.2em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .key-btn:active {
            transform: scale(0.95);
            background: rgba(0, 242, 254, 0.4);
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .btn-clear {
            background: #ff0055;
            color: white;
        }

        .btn-submit {
            background: #00f2fe;
            color: #000;
        }

        .action-btn:active {
            opacity: 0.8;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
            transition: all 0.8s ease;
        }

        .correct { color: #00ff88; }
        .incorrect { color: #ff0055; }
    </style>
</head>
<body>

    <div class="quiz-card">
        <div class="header">
            <span class="timer" id="timer">Temps: 0s</span>
            <span class="score" id="score">Score: 0</span>
        </div>

        <div class="question-box">
            <div class="kanji-display" id="kanji">水</div>
        </div>

        <!-- inputmode="none" et readonly empêchent l'ouverture du clavier mobile tout en autorisant le clavier virtuel -->
        <input type="text" class="input-display" id="answerInput" inputmode="none" readonly placeholder="Saisie..." />

        <div class="virtual-keyboard" id="keyboard"></div>

        <div class="action-btns">
            <button class="action-btn btn-clear" id="clearBtn">Effacer</button>
            <button class="action-btn btn-submit" id="submitBtn">Valider</button>
        </div>

        <div class="feedback" id="feedback"></div>
    </div>

    <script>
        const questions = [
            { kanji: "水", answer: "mizu" },
            { kanji: "火", answer: "hi" },
            { kanji: "木", answer: "ki" },
            { kanji: "金", answer: "kane" },
            { kanji: "土", answer: "tsuchi" }
        ];

        let currentQuestion = 0;
        let score = 0;
        let seconds = 0;
        let timerInterval;

        const kanjiElement = document.getElementById("kanji");
        const answerInput = document.getElementById("answerInput");
        const keyboardElement = document.getElementById("keyboard");
        const scoreElement = document.getElementById("score");
        const timerElement = document.getElementById("timer");
        const feedbackElement = document.getElementById("feedback");

        function startTimer() {
            timerInterval = setInterval(() => {
                seconds++;
                timerElement.textContent = `Temps: ${seconds}s`;
            }, 1000);
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function generateKeyboard() {
            keyboardElement.innerHTML = "";
            const letters = "abcdefghijklmnopqrstuvwxyz".split("");
            const shuffledLetters = shuffle([...letters]);

            shuffledLetters.forEach(letter => {
                const btn = document.createElement("button");
                btn.classList.add("key-btn");
                btn.textContent = letter;
                btn.addEventListener("click", () => {
                    answerInput.value += letter;
                });
                keyboardElement.appendChild(btn);
            });
        }

        function loadQuestion() {
            kanjiElement.textContent = questions[currentQuestion].kanji;
            answerInput.value = "";
            generateKeyboard();
        }

        document.getElementById("clearBtn").addEventListener("click", () => {
            answerInput.value = "";
        });

        document.getElementById("submitBtn").addEventListener("click", () => {
            const userAnswer = answerInput.value.trim().toLowerCase();
            const correctAnswer = questions[currentQuestion].answer;

            if (userAnswer === correctAnswer) {
                score += 10;
                scoreElement.textContent = `Score: ${score}`;
                feedbackElement.textContent = "Correct !";
                feedbackElement.className = "feedback correct";
            } else {
                feedbackElement.textContent = `Incorrect ! La réponse était: ${correctAnswer}`;
                feedbackElement.className = "feedback incorrect";
            }

            setTimeout(() => {
                feedbackElement.textContent = "";
                currentQuestion = (currentQuestion + 1) % questions.length;
                loadQuestion();
            }, 800);
        });

        startTimer();
        loadQuestion();
    </script>
</body>
</html>
